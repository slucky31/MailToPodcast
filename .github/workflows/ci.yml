name: CI

on:
  pull_request:
    branches: [ main ]

# A new push to a PR makes the run in progress for its previous commit useless: cancel it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore MailToPodcast.slnx
      - name: Check format
        run: dotnet format MailToPodcast.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build MailToPodcast.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test --solution MailToPodcast.slnx --configuration Release --no-build --results-directory test-results --coverage --coverage-output-format cobertura
