name: CD

on:
  push:
    branches: [ main ]

# One CD run at a time on main: two overlapping runs would compute the same next version.
# Release commits get a group of their own so they never take the place of a queued merge.
concurrency:
  group: ${{ startsWith(github.event.head_commit.message, 'chore(release):') && format('cd-release-commit-{0}', github.sha) || 'cd-main' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    # The release job pushes a "chore(release): 10.x.y.z" commit, which re-triggers this workflow:
    # that commit only bumps the version and the changelog, so it is skipped.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      tag_template: ${{ steps.version.outputs.tag_template }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Install Versionize
        run: dotnet tool install --global Versionize
      - name: Restore
        run: dotnet restore MailToPodcast.slnx
      # Version = <DotNetMajor>.x.y.z (ADR-0011): Versionize computes x.y.z in full SemVer,
      # tags are v<DotNetMajor>.x.y.z.
      - name: Compute next version
        id: version
        run: |
          dotnet_major=$(grep -oP '(?<=<DotNetMajor>)\d+' Directory.Build.props)
          tag_template="v${dotnet_major}.{version}"
          echo "tag_template=$tag_template" >> "$GITHUB_OUTPUT"
          set +e
          output=$(versionize --dry-run --exit-insignificant-commits --tag-template "$tag_template" 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          if [ $exit_code -eq 0 ]; then
            semver=$(echo "$output" | grep -oP 'bumping version from \S+ to \K\S+')
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "No significant commit since the last release, skipping."
            semver=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "version=${dotnet_major}.${semver}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: dotnet build MailToPodcast.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test --solution MailToPodcast.slnx --configuration Release --no-build --results-directory test-results --coverage --coverage-output-format cobertura

  release:
    name: Release
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && needs.build.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # RELEASE_TOKEN (classic PAT of an admin, see ADR-0011) is needed once main is protected:
      # GITHUB_TOKEN cannot push to a protected branch. Until then GITHUB_TOKEN is enough.
      # The token is set on checkout because the credentials it persists win over any later one.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # A merge that landed on main after this run started is not in this release commit:
      # leave the release to that merge's run, queued behind this one.
      - name: Check main is still at this run's commit
        id: main-head
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved past $GITHUB_SHA: the next CD run releases these commits."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup git
        if: steps.main-head.outputs.current == 'true'
        run: |
          git config --global user.email "nicolas.dufaut@gmail.com"
          git config --global user.name "slucky31"

      - name: Install Versionize
        if: steps.main-head.outputs.current == 'true'
        run: dotnet tool install --global Versionize

      # Pins the x.y.z part the build job computed. Versionize bumps <Version> and writes
      # CHANGELOG.md only: the changelog heading, the release commit and the tag are then
      # given the full product version 10.x.y.z (ADR-0011).
      - name: Versioning
        if: steps.main-head.outputs.current == 'true'
        env:
          SEMVER: ${{ needs.build.outputs.semver }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          versionize --release-as "$SEMVER" --tag-template "${{ needs.build.outputs.tag_template }}" --skip-commit --skip-tag
          escaped=$(echo "$SEMVER" | sed 's/\./\\./g')
          sed -i -E "s/^<a name=\"$escaped\"><\/a>/<a name=\"$VERSION\"><\/a>/; s/^## (\[?)$escaped([] ])/## \1$VERSION\2/" CHANGELOG.md
          git add Directory.Build.props CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag -a "v$VERSION" -m "chore(release): $VERSION"

      # Never forced: if main moved in the meantime, the push fails instead of dropping a merge.
      - name: Push release commit and tag
        if: steps.main-head.outputs.current == 'true'
        run: git push --follow-tags origin HEAD:main

      - name: Create GitHub release
        if: steps.main-head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ needs.build.outputs.version }}" --title "v${{ needs.build.outputs.version }}" --generate-notes
